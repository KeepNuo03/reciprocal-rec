services:
  recommend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/prepared:/app/data/prepared:ro
      - ./artifacts/retrieval:/app/artifacts/retrieval:ro
      - ./artifacts/ranking:/app/artifacts/ranking:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
