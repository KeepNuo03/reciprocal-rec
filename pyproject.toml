[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reciprocal-rec"
version = "0.1.0"
description = "Reciprocal recommendation for two-sided markets"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
data = ["pyspark==3.5.8", "PyYAML>=6,<7"]
retrieval = ["torch>=2.8,<3", "faiss-cpu>=1.10,<2", "numpy>=1.25,<3", "pyarrow>=18,<25", "PyYAML>=6,<7"]
ranking = ["lightgbm>=4.7,<5", "scipy>=1.12,<2"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["reciprec", "reciprec.*"]
