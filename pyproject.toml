[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reciprocal-rec"
version = "0.1.0"
description = "Reciprocal recommendation for two-sided markets"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["reciprec", "reciprec.*"]
